<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scarlett Rey</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://kit.fontawesome.com/8a3fde9d6a.js" crossorigin="anonymous"></script>
</head>
<body>
    <section id="landing-page">
        <nav>
            <figure>
                <img id="personal-logo" src="assets/logo-creations-by-rey.jpeg" alt="Designer Logo">
            </figure>
            <ul class="nav__link--list">
                <li class="nav__link">
                    <a href="#" class="
                    nav__link--anchor
                    link__hover-effect
                    link__hover-effect--black
                    ">About</a>
                </li>
                <li class="nav__link">
                    <a href="#" class="
                    nav__link--anchor
                    link__hover-effect
                    link__hover-effect--black
                    ">Projects</a>
                </li>
                <li class="nav__link">
                    <a href="#" class="
                    nav__link--anchor
                    link__hover-effect
                    link__hover-effect--black
                    ">Contact</a>
                </li>
                <li class="nav__link">
                    <a href="#" class="
                    nav__link--anchor
                    link__hover-effect
                    link__hover-effect--black
                    "><i class="fa-solid fa-circle-half-stroke"></i>
                </li>
            </ul>
        </nav>
        <header class="header">
            <div class="header__content">
                <h1 class="title">Hey,</h1>
                <h1 class="blue">I'm Rey</h1>
                <p class="header__para">I'm a <b class="blue">Frontend Software Engineer </b>from artsy Portland, Oregon, USA! I'm a school-teacher turned passionate site designer. Here's a little more <b class="blue">about me</b>!</p>
            </div>
            <div class="social__list">
                <a href="" class="social__link">
                    <i class="fa-brands fa-linkedin"></i>
                </a>
                <a href="" class="social__link">
                    <i class="fa-brands fa-github"></i>
                </a>
                <a href="" class="social__link">
                    <i class="fa-solid fa-pdf"></i>
                </a>
            </div>
        </header>
    </section>
</body>
</html>
